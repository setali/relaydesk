services:
  gateway:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    network_mode: host
    restart: unless-stopped
    environment:
      RELAYDESK_DOMAIN: ${RELAYDESK_DOMAIN:?Run the HTTPS setup first}
      RELAYDESK_HTTP_PORT: ${RELAYDESK_HTTP_PORT:-3210}
    volumes:
      - ./${RELAYDESK_CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - gateway-config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
volumes:
  certificates:
  gateway-config:
