name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - run: npm run check
      - run: docker build -t relaydesk:ci .
      - run: docker run --rm -i --read-only --tmpfs /tmp --cap-drop=ALL --security-opt=no-new-privileges:true relaydesk:ci node --input-type=module < test/container-smoke.mjs
