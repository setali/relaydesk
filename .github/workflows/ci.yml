name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - run: npm run check
      - name: Check bootstrap shell safety
        run: docker run --rm --network none -v "$PWD:/mnt:ro" koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb /mnt/bootstrap.sh /mnt/https.sh /mnt/install.sh /mnt/relaydesk
      - name: Validate managed gateway without contacting certificate authorities
        run: docker run --rm --network none --read-only --tmpfs /data --tmpfs /config --tmpfs /tmp -e RELAYDESK_DOMAIN=relay.example.com -e RELAYDESK_HTTP_PORT=3210 -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Test Docker package setup without installing packages
        run: docker run --rm --read-only --network none --tmpfs /tmp --tmpfs /etc/apt/keyrings --tmpfs /etc/apt/sources.list.d -e RELAYDESK_PACKAGE_FIXTURE=1 -v "$PWD:/workspace:ro" debian:bookworm-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251 bash /workspace/test/bootstrap-packages.sh
      - run: docker build -t relaydesk:ci .
      - run: docker run --rm -i --read-only --tmpfs /tmp --cap-drop=ALL --security-opt=no-new-privileges:true relaydesk:ci node --input-type=module < test/container-smoke.mjs
